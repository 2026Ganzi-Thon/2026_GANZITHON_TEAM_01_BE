spring:
  application:
    name: som
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SOM_DB_URL}
    username: ${SOM_DB_USER}
    password: ${SOM_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true   # DTO에 없는 필드(userId·'안 보는 것' 등)는 거부한다

server:
  servlet:
    session:
      timeout: 30m          # 세션 만료 (명세에 값 없음 → 설정값)
      cookie:
        http-only: true
        secure: true
        same-site: lax

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SOM_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SOM_API_DOCS_ENABLED:true}
  paths-to-match: /api/**   # 공개 API만 문서화 (테스트 전용 /test/** 등 제외)

som:
  auth:
    login-id:
      min-length: 4
      max-length: 13
      pattern: "^[a-z0-9]+$"   # TODO(DECISION): 아이디 허용 문자 미확정(A_SPEC §3). 임시 기본값 = 영문 소문자+숫자
    password:
      min-length: 10
      max-length: 12           # TODO(DECISION): 화면 확정값이나 보안상 낮음 → 확대 권고(A_SPEC §3, §17-9)
      require-letter: true     # TODO(DECISION): 조합 규칙 미확정. 임시 기본값 = 영문·숫자 각 1자 이상
      require-digit: true
  time:
    zone: Asia/Seoul
  request-id:
    header: X-Request-ID
    max-length: 64

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
