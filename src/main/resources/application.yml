spring:
  application:
    name: som
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SOM_DB_URL}
    username: ${SOM_DB_USER}
    password: ${SOM_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true   # DTO에 없는 필드(userId·'안 보는 것' 등)는 거부한다

server:
  servlet:
    session:
      timeout: 30m          # 세션 만료 (명세에 값 없음 → 설정값)
      cookie:
        http-only: true
        secure: true
        same-site: lax

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SOM_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SOM_API_DOCS_ENABLED:true}
  paths-to-match: /api/**   # 공개 API만 문서화 (테스트 전용 /test/** 등 제외)

som:
  auth:
    login-id:
      min-length: 4
      max-length: 13
      pattern: "^[a-z0-9]+$"   # TODO(DECISION): 아이디 허용 문자 미확정(A_SPEC §3). 임시 기본값 = 영문 소문자+숫자
    password:
      min-length: 10
      max-length: 12           # TODO(DECISION): 화면 확정값이나 보안상 낮음 → 확대 권고(A_SPEC §3, §17-9)
      require-letter: true     # TODO(DECISION): 조합 규칙 미확정. 임시 기본값 = 영문·숫자 각 1자 이상
      require-digit: true
  consent:
    required:
      # TODO(DECISION): 약관 정책 버전 미확정. 아래는 [제안] 값
      AGE_14_PLUS:        { policy-version: "v1" }
      TERMS_OF_SERVICE:   { policy-version: "v1" }
      PRIVACY_COLLECTION: { policy-version: "v1" }
    sources:
      # 항목별 동의 시트 고지 내용(A_SPEC §5). 연결·철회 시 이 값을 user_consents에 그대로 기록한다.
      # TODO(DECISION): 연동 동의 정책 버전 미확정. 아래 v1은 [제안] 값
      SLEEP:
        policy-version: "v1"
        items: ["잠든 시각", "깬 시각"]
        purpose: "평소와 달라졌는지 살피는 데만 써요"
        retention: "TBD"          # TODO(DECISION): 보관 기간 미정(A_SPEC §5). 탈퇴 시 즉시 삭제는 확정
        sensitive: true           # 건강 정보 · 별도 동의 (화면 확정)
      STEPS:
        policy-version: "v1"
        items: ["하루 걸음 수"]
        purpose: "TBD"            # TODO(DECISION): 화면 문구 미확인
        retention: "TBD"          # TODO(DECISION)
        sensitive: false          # TODO(DECISION): 걸음 수의 건강정보 분류 미정(A_SPEC §5)
      SCREEN_TIME:       { policy-version: "v1", items: ["시간대별 총 사용 시간"], purpose: "TBD", retention: "TBD", sensitive: false }  # TODO(DECISION): purpose·retention
      CALENDAR_PERSONAL: { policy-version: "v1", items: ["일정 수", "바쁜 시간대"], purpose: "TBD", retention: "TBD", sensitive: false }   # TODO(DECISION)
      CALENDAR_WORK:     { policy-version: "v1", items: ["바쁜 정도"], purpose: "TBD", retention: "TBD", sensitive: false }              # TODO(DECISION): 화면 잘림
    delete-signals-on-revoke: true   # TODO(DECISION): 철회 시 보유 데이터 삭제 정책 미확정(A_SPEC §5). 임시 기본값 = 즉시 삭제(보수적)
    gate:
      exempt-paths:            # 필수 동의 전에도 허용 (계정·약관·삭제·탈퇴 API)
        - /api/v1/auth/**
        - /api/v1/me             # GET 본인 조회, DELETE 탈퇴
        - /api/v1/me/data        # 기록 삭제
        - /api/v1/me/deletion-status
        - /api/v1/me/consents
        - /api/v1/help-resources   # 위기 안내는 동의 전에도(A_SPEC §10)
  signals:
    ingest-enabled: true          # 데모·개발용 수신 API. 운영 프로필에서 false로 끌 수 있음(A_SPEC §5) — false면 404
    max-entries-per-request: 48
  rate-limit:
    max-tracked-keys: 10000      # 키 저장소 상한(메모리 보호)
    login:
      # TODO(DECISION): 로그인 요청 제한 값 미확정(A_SPEC §3·§11). 아래는 [제안] 값
      per-ip:       { capacity: 20, refill-period: 1m }
      per-login-id: { capacity: 5,  refill-period: 5m }
    signup:
      # TODO(DECISION): 가입 요청 제한 값 미확정(ADR-008 목록 밖, 리뷰 반영). 아래는 [제안] 값
      per-ip:       { capacity: 10, refill-period: 1h }
    signals:
      # TODO(DECISION): 수집 요청 제한 값 미확정(ADR-008). 아래는 [제안] 값
      per-user:     { capacity: 30, refill-period: 1m }
    chat:
      # TODO(DECISION): 대화 요청 제한 값 미확정(A_SPEC §11 분당/일일). 아래는 [제안] 값
      per-user-minute: { capacity: 10,  refill-period: 1m }
      per-user-day:    { capacity: 200, refill-period: 1d }
    deletion:
      # TODO(DECISION): 삭제 요청 제한 값 미확정(A_SPEC §11). 아래는 [제안] 값
      per-user:     { capacity: 3, refill-period: 1h }
  checkin:
    max-stressors: 1             # TODO(DECISION): Q2 최대 선택 개수 미정(A_SPEC §6). 기본 1
    max-range-days: 31           # GET /checkins?from=&to= 최대 기간(명세에 값 없음 → 설정값)
  state:
    bubble-text:
      # TODO(DECISION): 말풍선 출처·문구 B 합의 대기(A_SPEC §7). 아래는 [제안] 임시 문구
      levels:
        - "오늘 마음이 가벼워 보여요. 이야기 나눠 볼래요?"
        - "조금 지쳐 보여요. 잠깐 쉬어 갈까요?"
        - "피로가 쌓였나 봐요. 오늘 이야기를 들려줄래요?"
        - "많이 지쳤죠. 천천히 같이 쉬어 가요."
      insufficient: "오늘 마음은 어떤가요? 체크인으로 알려 주세요."
  chat:
    max-length: 500              # TODO(DECISION): 대화 입력 최대 길이 미정(A_SPEC §8). 기본 500자
    recent-turns: 10             # engine에 넘기는 최근 메시지 수(B 합의 대기)
    send-user-text-to-engine: ${SOM_CHAT_SEND_USER_TEXT_TO_ENGINE:false}
    fallback-text: "지금은 잠시 답변이 어려워요. 호흡 루틴을 먼저 해볼까요?"   # engine 실패 시 고정 문구(A_SPEC §8)
    page-size: 30
    max-page-size: 100
  notification:
    default-enabled: false       # 설정 행이 없을 때 기본값(발송은 P1, A_SPEC §10)
  insights:
    allowed-days: [7, 30]        # 마이 기간 기록(A_SPEC §13)
  routine:
    done-min-completed: 1        # TODO(DECISION): '이행' 기준 미정(A_SPEC §9). 기본: 1개 이상 완료
  journal:
    requires-all-routines: true  # 마음 정리는 오늘 루틴 4개 모두 완료 시 열림(A_SPEC §9 기본값)
    max-text-length: 1000        # TODO(DECISION): 자유 기록 최대 길이 미정(A_SPEC §9). 기본 1000자
    allow-empty: true            # TODO(DECISION): 감정·기록 둘 다 비어도 완료 허용(A_SPEC §9 기본값)
  idempotency:
    retention: 24h            # Idempotency-Key 보존 기간(명세에 값 없음 → 설정값)
  engine:
    mode: ${SOM_ENGINE_MODE:mock}
    url: ${SOM_ENGINE_URL:http://127.0.0.1:8000}
    token: ${SOM_ENGINE_TOKEN:}
    chat-timeout: 15s
    timeout: 2s                  # engine 호출 1회 타임아웃(A_SPEC §12 — 상한은 설정)
    max-attempts: 2              # 최초 포함 최대 시도 횟수
    pool-size: 4                 # engine 호출 전용 스레드 수
    mock:
      # B 초안(A_SPEC §12) — 확정값 아님. 점수→단계: 0~24=1, 25~49=2, 50~74=3, 75~100=4
      level-min-scores: [25, 50, 75]
      wool-kg: [0.8, 1.6, 2.4, 3.2]
      chat:
        crisis-keywords: ["죽고 싶", "사라지고 싶", "자해"]   # Mock 위기 분류용(개발·테스트). 실제 기준은 B
      levels:                    # 단계별 상태·보조 문구(A_SPEC §7 화면 확정 표)
        - { status-text: "마음이 가벼워요",       sub-text: "지금의 편안함을 느껴보세요." }
        - { status-text: "조금 지쳐 있어요",      sub-text: "잠깐 쉬어가도 괜찮아요." }
        - { status-text: "피로가 쌓였어요",       sub-text: "오늘은 나를 먼저 돌봐주세요." }
        - { status-text: "충분한 쉼이 필요해요",  sub-text: "혼자 애쓰지 않아도 괜찮아요." }
  time:
    zone: Asia/Seoul
  request-id:
    header: X-Request-ID
    max-length: 64

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    # DaoAuthenticationProvider는 DEBUG에서 실패한 loginId를 로그에 쓴다 → 전역 DEBUG에서도 남지 않게 고정
    org.springframework.security.authentication: INFO
