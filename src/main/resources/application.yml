spring:
  application:
    name: som
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SOM_DB_URL}
    username: ${SOM_DB_USER}
    password: ${SOM_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    session:
      timeout: 30m          # 세션 만료 (명세에 값 없음 → 설정값)
      cookie:
        http-only: true
        secure: true
        same-site: lax

som:
  time:
    zone: Asia/Seoul
  request-id:
    header: X-Request-ID
    max-length: 64

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
