plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.som'
version = '0.0.1-SNAPSHOT'

// JDK 25로 빌드하되 바이트코드·API는 Java 17 타깃 (toolchain 미사용)
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// Argon2PasswordEncoder 의존성 (ADR-005)
	implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// 메모리 기반 요청 횟수 제한 (ADR-008)
	implementation 'com.bucket4j:bucket4j_jdk17-core:8.22.0'
	// Boot 3.5.x 호환 2.x 최신 안정 (springdoc 2.10.0은 Boot 3.5.16 기반)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.10.0'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// OpenAPI info.version에 프로젝트 버전을 쓰기 위해 build-info.properties 생성 (시각은 제외해 빌드 캐시 유지)
springBoot {
	buildInfo {
		excludes = ['time']
	}
}
