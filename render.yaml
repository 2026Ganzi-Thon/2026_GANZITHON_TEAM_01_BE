services:
  - type: web
    name: som-team-01-api
    runtime: docker
    branch: main
    plan: free
    region: singapore
    healthCheckPath: /swagger-ui/index.html
    envVars:
      - key: SOM_DB_HOST
        fromDatabase:
          name: som-team-01-db
          property: host
      - key: SOM_DB_PORT
        fromDatabase:
          name: som-team-01-db
          property: port
      - key: SOM_DB_NAME
        fromDatabase:
          name: som-team-01-db
          property: database
      - key: SOM_DB_USER
        fromDatabase:
          name: som-team-01-db
          property: user
      - key: SOM_DB_PASSWORD
        fromDatabase:
          name: som-team-01-db
          property: password
      - key: SOM_ENGINE_TOKEN
        generateValue: true
      - key: SOM_CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,https://som-01.netlify.app"
      - key: SOM_SESSION_COOKIE_SAME_SITE
        value: none
      - key: SOM_CSRF_CROSS_SITE
        value: "true"
databases:
  - name: som-team-01-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
